<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruckitTools – Admin Tools</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js"></script>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#000; color:#e5e7eb; }
header {
  background:#020617; color:#22c55e; padding:12px 15px; text-align:center;
  border-bottom:1px solid #14532d; position:relative; min-height:56px;
}
.back-link {
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  background:#16a34a; color:#000; text-decoration:none; font-size:13px; font-weight:bold;
  padding:8px 12px; border-radius:6px; z-index:2;
}
@media (max-width:600px) { .back-link { top:10px; transform:none; } }
.container { padding:15px; max-width:800px; margin:0 auto; }
.card {
  background:#020617; border-radius:8px; padding:15px; margin-bottom:15px;
  border:1px solid #14532d;
}
button {
  background:#16a34a; color:#000; border:none; padding:10px 14px;
  border-radius:6px; cursor:pointer; font-size:15px; margin:4px 4px 4px 0;
}
button.secondary { background:#1e40af; color:#fff; }
button.cancel { background:#dc2626; color:#fff; }
input, textarea {
  padding:10px; width:100%; margin-bottom:10px; background:#000; color:#22c55e;
  border:1px solid #14532d; border-radius:6px; font-size:16px; box-sizing:border-box;
}
.field-label { font-size:13px; color:#94a3b8; margin-bottom:4px; display:block; }
.hidden { display:none; }
.user-row {
  background:#022c22; border:1px solid #14532d; border-radius:8px;
  padding:12px; margin-bottom:10px;
}
.user-row h4 { margin:0 0 6px 0; color:#22c55e; }
.user-row p { margin:3px 0; font-size:13px; color:#94a3b8; }
.form-grid { display:flex; gap:10px; flex-wrap:wrap; }
.form-grid > div { flex:1; min-width:140px; }
.error { color:#fca5a5; font-size:13px; margin:8px 0; }
</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">← Home</a>
  <span style="color:#22c55e;font-weight:bold;font-size:20px;">Admin Tools</span>
</header>
<div class="container">
  <div class="card" id="adminLoginCard">
    <h2 style="margin-top:0;color:#22c55e;">Admin Login</h2>
    <span class="field-label">Username</span>
    <input type="text" id="adminUser" autocomplete="username">
    <span class="field-label">Password</span>
    <input type="password" id="adminPass" autocomplete="current-password">
    <div class="error hidden" id="adminLoginErr"></div>
    <button type="button" onclick="adminPageLogin()">Sign In</button>
  </div>
  <div class="card hidden" id="adminApp">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <h2 style="margin:0;color:#22c55e;">Broker Portal Users</h2>
      <button type="button" onclick="showCreateForm()">+ New User</button>
    </div>
    <p style="font-size:13px;color:#94a3b8;" id="userCountLine"></p>
    <div id="userList"></div>
  </div>
  <div class="card hidden" id="userFormCard">
    <h3 style="margin-top:0;color:#22c55e;" id="formTitle">New User</h3>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div><span class="field-label">First name</span><input type="text" id="firstName"></div>
      <div><span class="field-label">Last name</span><input type="text" id="lastName"></div>
    </div>
    <span class="field-label">Date of birth</span>
    <input type="date" id="dob">
    <span class="field-label">Phone number</span>
    <input type="tel" id="phone">
    <span class="field-label">Secondary phone number</span>
    <input type="tel" id="phone2">
    <span class="field-label">Address</span>
    <textarea id="address" rows="3"></textarea>
    <span class="field-label">Username *</span>
    <input type="text" id="username" autocomplete="off">
    <div id="passwordCreateWrap">
      <span class="field-label">Password *</span>
      <input type="password" id="password" autocomplete="new-password">
    </div>
    <div class="error hidden" id="formErr"></div>
    <button type="button" onclick="saveUserForm()">Save User</button>
    <button type="button" class="cancel" onclick="cancelForm()">Cancel</button>
  </div>
  <div class="card hidden" id="passwordCard">
    <h3 style="margin-top:0;color:#22c55e;">Change Password</h3>
    <p id="pwUserLabel" style="font-size:14px;color:#94a3b8;"></p>
    <input type="hidden" id="pwUserId">
    <span class="field-label">New password</span>
    <input type="password" id="newPassword" autocomplete="new-password">
    <span class="field-label">Confirm new password</span>
    <input type="password" id="newPassword2" autocomplete="new-password">
    <div class="error hidden" id="pwErr"></div>
    <button type="button" onclick="savePassword()">Save Password</button>
    <button type="button" class="cancel" onclick="cancelForm()">Cancel</button>
  </div>
</div>
<script>
const ADMIN_USER = 'Admin';
const ADMIN_PASS = 'Truckit757';
const USERS_KEY = 'truckit_broker_users';
const MAX_USERS = 10;
const ADMIN_SESSION = 'truckit_admin_session';

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getUsers() {
  try {
    const raw = localStorage.getItem(USERS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveUsers(list) {
  localStorage.setItem(USERS_KEY, JSON.stringify(list));
  if (window.TruckitCloud && TruckitCloud.pushKeyFromLocal) {
    TruckitCloud.pushKeyFromLocal(USERS_KEY);
  }
}
async function pullUsers() {
  if (window.TruckitCloud && TruckitCloud.pullKey && TruckitCloud.isConfigured && TruckitCloud.isConfigured()) {
    try { await TruckitCloud.pullKey(USERS_KEY); } catch (e) { console.warn(e); }
  }
  return getUsers();
}
function adminPageLogin() {
  const u = (document.getElementById('adminUser').value || '').trim();
  const p = document.getElementById('adminPass').value || '';
  const err = document.getElementById('adminLoginErr');
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem(ADMIN_SESSION, JSON.stringify({ at: Date.now() }));
    err.classList.add('hidden');
    showApp();
  } else {
    err.textContent = 'Invalid admin credentials.';
    err.classList.remove('hidden');
  }
}
function showApp() {
  document.getElementById('adminLoginCard').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  cancelForm();
  renderUsers();
}
function cancelForm() {
  document.getElementById('userFormCard').classList.add('hidden');
  document.getElementById('passwordCard').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
}
function renderUsers() {
  const list = getUsers();
  document.getElementById('userCountLine').textContent = list.length + ' / ' + MAX_USERS + ' users';
  const el = document.getElementById('userList');
  if (!list.length) {
    el.innerHTML = '<p style="color:#64748b;font-size:13px;">No users yet. Tap + New User.</p>';
    return;
  }
  el.innerHTML = list.map(function (u) {
    const name = [u.firstName, u.lastName].filter(Boolean).join(' ') || '—';
    return '<div class="user-row">' +
      '<h4>' + escapeHtml(u.username) + '</h4>' +
      '<p><strong>Name:</strong> ' + escapeHtml(name) + '</p>' +
      '<p><strong>DOB:</strong> ' + escapeHtml(u.dob || '—') + ' · <strong>Phone:</strong> ' + escapeHtml(u.phone || '—') + '</p>' +
      '<p><strong>Alt phone:</strong> ' + escapeHtml(u.phone2 || '—') + '</p>' +
      '<p><strong>Address:</strong> ' + escapeHtml(u.address || '—') + '</p>' +
      '<div class="row-actions">' +
        '<button type="button" class="secondary" onclick="editUser(\'' + u.id + '\')">Edit</button>' +
        '<button type="button" class="secondary" onclick="changePassword(\'' + u.id + '\')">Change Password</button>' +
        '<button type="button" class="cancel" onclick="deleteUser(\'' + u.id + '\')">Delete</button>' +
      '</div></div>';
  }).join('');
}
function clearForm() {
  document.getElementById('editId').value = '';
  ['firstName','lastName','dob','phone','phone2','address','username','password'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('formErr').classList.add('hidden');
}
function showCreateForm() {
  if (getUsers().length >= MAX_USERS) {
    alert('Maximum of ' + MAX_USERS + ' users reached.');
    return;
  }
  clearForm();
  document.getElementById('formTitle').textContent = 'New User';
  document.getElementById('passwordCreateWrap').classList.remove('hidden');
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('passwordCard').classList.add('hidden');
  document.getElementById('userFormCard').classList.remove('hidden');
}
function editUser(id) {
  const u = getUsers().find(function (x) { return x.id === id; });
  if (!u) return;
  document.getElementById('editId').value = u.id;
  document.getElementById('firstName').value = u.firstName || '';
  document.getElementById('lastName').value = u.lastName || '';
  document.getElementById('dob').value = u.dob || '';
  document.getElementById('phone').value = u.phone || '';
  document.getElementById('phone2').value = u.phone2 || '';
  document.getElementById('address').value = u.address || '';
  document.getElementById('username').value = u.username || '';
  document.getElementById('password').value = '';
  document.getElementById('passwordCreateWrap').classList.add('hidden');
  document.getElementById('formTitle').textContent = 'Edit User';
  document.getElementById('formErr').classList.add('hidden');
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('passwordCard').classList.add('hidden');
  document.getElementById('userFormCard').classList.remove('hidden');
}
function saveUserForm() {
  const err = document.getElementById('formErr');
  const editId = document.getElementById('editId').value;
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const dob = document.getElementById('dob').value;
  const phone = document.getElementById('phone').value.trim();
  const phone2 = document.getElementById('phone2').value.trim();
  const address = document.getElementById('address').value.trim();
  if (!username) { err.textContent = 'Username is required.'; err.classList.remove('hidden'); return; }
  if (username.toLowerCase() === 'admin') { err.textContent = 'That username is reserved.'; err.classList.remove('hidden'); return; }
  const list = getUsers();
  if (!editId && list.length >= MAX_USERS) { err.textContent = 'Maximum of ' + MAX_USERS + ' users reached.'; err.classList.remove('hidden'); return; }
  if (list.some(function (u) { return u.username.toLowerCase() === username.toLowerCase() && u.id !== editId; })) {
    err.textContent = 'Username already exists.'; err.classList.remove('hidden'); return;
  }
  if (!editId && !password) { err.textContent = 'Password is required for new users.'; err.classList.remove('hidden'); return; }
  if (editId) {
    const u = list.find(function (x) { return x.id === editId; });
    if (!u) return;
    u.firstName = firstName; u.lastName = lastName; u.dob = dob;
    u.phone = phone; u.phone2 = phone2; u.address = address; u.username = username;
    u.updatedAt = new Date().toISOString();
  } else {
    list.push({
      id: 'bu_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      username: username, password: password, firstName: firstName, lastName: lastName,
      dob: dob, phone: phone, phone2: phone2, address: address,
      createdAt: new Date().toISOString()
    });
  }
  saveUsers(list);
  showApp();
}
function deleteUser(id) {
  const u = getUsers().find(function (x) { return x.id === id; });
  if (!u) return;
  if (!confirm('Delete user “' + u.username + '”?')) return;
  saveUsers(getUsers().filter(function (x) { return x.id !== id; }));
  renderUsers();
}
function changePassword(id) {
  const u = getUsers().find(function (x) { return x.id === id; });
  if (!u) return;
  document.getElementById('pwUserId').value = u.id;
  document.getElementById('pwUserLabel').textContent = 'User: ' + u.username;
  document.getElementById('newPassword').value = '';
  document.getElementById('newPassword2').value = '';
  document.getElementById('pwErr').classList.add('hidden');
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('userFormCard').classList.add('hidden');
  document.getElementById('passwordCard').classList.remove('hidden');
}
function savePassword() {
  const id = document.getElementById('pwUserId').value;
  const a = document.getElementById('newPassword').value;
  const b = document.getElementById('newPassword2').value;
  const err = document.getElementById('pwErr');
  if (!a) { err.textContent = 'Enter a new password.'; err.classList.remove('hidden'); return; }
  if (a !== b) { err.textContent = 'Passwords do not match.'; err.classList.remove('hidden'); return; }
  const list = getUsers();
  const u = list.find(function (x) { return x.id === id; });
  if (!u) return;
  u.password = a;
  u.updatedAt = new Date().toISOString();
  saveUsers(list);
  showApp();
}
document.getElementById('adminPass').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') adminPageLogin();
});
(async function boot() {
  await pullUsers();
  try {
    if (sessionStorage.getItem(ADMIN_SESSION)) showApp();
  } catch (e) {}
})();
</script>
</body>
</html>
